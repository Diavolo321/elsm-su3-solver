# Source: Table II of arXiv:2512.22198v2, SU(3), both rows (c != 0 and c = 0).
# All dimensional quantities are in GeV or powers of GeV.
model:
  nf: 3
  mu: 0.0
  T0: 0.270
  Tc: 0.270
  include_FT: false  # Eq. (43), separate from the Eq. (32) thermal mass correction
  active_row: c_finite   # c_finite | c_zero  (Table II has two scalar-sector rows)
  rows:
    c_finite:
      c: 2.828
      m0_sq: -0.066564  # -(0.258 GeV)^2
      lambda1: 3.15
      lambda2: 36.253
    c_zero:
      c: 0.0
      m0_sq: -0.079524  # -(0.282 GeV)^2
      lambda1: -10.515
      lambda2: 55.576
  vector_sector:
    g1: 5.58
    c1: 0.44
    h2: 40.975
    h3: -15.216
    g: 5.5
  vacuum:
    # Primary convention = the authors' (verified against Tables I, III, V):
    method: yukawa           # yukawa (primary) | pcac (diagnostic only, wrong vacuum)
    constituent_mass: 0.300  # m_q, GeV
    sigma_x: 0.109091        # = 2*m_q/g  (fixed, not fitted)
    sigma_y: 0.10361         # fitted to Table I pi, eta, eta', sigma (c_finite); 0.10357 for c_zero
    # h_x, h_y are always derived from Eqs. (15)-(16) at (sigma_x, sigma_y)
    # Inputs for Z factors (Eq. A13): fitted masses from Table I / Table V
    z_inputs: {g1: 5.58, m_a1: 1.06976, m_k1: 1.25346, m_f1s: 1.42477, m_kstar: 0.851}
  polyakov:
    parametrization: "Roessner-Ratti-Weise logarithmic"
    a0: 3.51
    a1: -2.47
    a2: 15.2
    b3: -1.75
    source: "Roessner et al., Phys. Rev. D 75, 034007 (2007), DOI 10.1103/PhysRevD.75.034007; same standard set quoted in later PLSM literature"
  quark_vacuum:
    prescription: "omit"   # no-sea; reproduces Table III T_chi within 2.5 MeV
    note: "Eq. (27) prefactor 2*nu_c is a misprint: the traced log already contains colour. Normalization -2T is consistent with nu_c=6 in Eq. (32)."
  quark_thermal:
    n_c: 3
    integration: "Simpson radial momentum integration"
    n_points: 1000
